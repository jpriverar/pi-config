id = "jp.space-tabs"
name = "Space tab metadata"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Show each space's tabs and actively claimed tasks."
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "-B", "sync_tabs.py"]

[[actions]]
id = "refresh"
title = "Refresh space tab metadata"
description = "Refresh tab and task metadata for every space."
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "workspace.created"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "tab.created"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "tab.closed"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "tab.focused"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "tab.renamed"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "tab.moved"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "pane.created"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "pane.closed"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "pane.moved"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "pane.exited"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-B", "sync_tabs.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-B", "sync_tabs.py"]
