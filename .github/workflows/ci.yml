name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.compat_lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compat_lane:
          - minimum
          - latest-0.84
    env:
      COMPAT_LANE: ${{ matrix.compat_lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install integration test tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/pi-test-tools"
          mkdir -p "$tools/bin" "$tools/beads" "$tools/dolt"
          curl --fail --silent --show-error --location \
            https://github.com/gastownhall/beads/releases/download/v1.1.2/beads_1.1.2_linux_amd64.tar.gz \
            --output "$tools/beads.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/dolthub/dolt/releases/download/v2.2.3/dolt-linux-amd64.tar.gz \
            --output "$tools/dolt.tar.gz"
          echo "a72d71ed374955dc9f83a0f90b54bd7b6a0016709dd1676ae2e368651ed401c2  $tools/beads.tar.gz" | sha256sum --check
          echo "ffafa7cc172cada5f77ca3fb96306545ddac44a111625f75f870306c7f197301  $tools/dolt.tar.gz" | sha256sum --check
          tar -xzf "$tools/beads.tar.gz" -C "$tools/beads"
          tar -xzf "$tools/dolt.tar.gz" -C "$tools/dolt"
          install -m 755 "$tools/beads/bd" "$tools/bin/bd"
          install -m 755 "$tools/dolt/dolt-linux-amd64/bin/dolt" "$tools/bin/dolt"
          "$tools/bin/bd" version
          "$tools/bin/dolt" version
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Run compatibility and public-safety gates
        shell: bash
        run: |
          set -euo pipefail
          if [ "$COMPAT_LANE" = minimum ]; then
            PI_VERSION=0.84.1
          else
            PI_VERSION=$(npm view @earendil-works/pi-coding-agent versions --json | node -e '
              const versions = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const matches = versions.filter((v) => /^0\.84\.\d+$/.test(v)).sort((a, b) => Number(a.split(".")[2]) - Number(b.split(".")[2]));
              if (matches.length === 0) process.exit(1);
              process.stdout.write(matches.at(-1));
            ')
            printf '### Latest Pi 0.84.x compatibility\n\n`%s`\n' "$PI_VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Testing Pi $PI_VERSION ($COMPAT_LANE)"
          npm ci
          npm install --no-save --package-lock=false "@earendil-works/pi-coding-agent@${PI_VERSION}" "@earendil-works/pi-tui@${PI_VERSION}"
          npm test
          npm run typecheck
          npm run format:check
          npm run verify:portable
          npm run licenses:check
          npm run verify:smoke -- --package "$GITHUB_WORKSPACE"
          npm run test:file -- tests/pinned-ref.test.ts
